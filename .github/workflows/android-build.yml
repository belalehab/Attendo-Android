name: Build Attendo Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Setup NDK Environment
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - run: npm install
      - run: npx tauri android init
      - run: npx tauri icon ../attendo-app/public/attendo-icon.png
        continue-on-error: true
      - run: npx tauri android build --debug --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: Attendo-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
