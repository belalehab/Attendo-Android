name: Build Attendo Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: zulu, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Setup NDK Environment
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - run: npm install
      - run: npx tauri android init
      - run: npx tauri icon public/attendo-icon.png
      - run: cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/ || true
      - run: npx tauri android build --apk --target aarch64
      - name: Sign Release APK
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -n 1)
          $APKSIGNER sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk || true
      - uses: actions/upload-artifact@v4
        with:
          name: Attendo-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
